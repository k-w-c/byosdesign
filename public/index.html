<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYOS — build your own</title>
<meta name="description" content="Useful projects you can build in a weekend.">
<meta property="og:title" content="BYOS — build your own">
<meta property="og:type" content="website">
<meta property="og:image" content="https://byosdesign.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:description" content="Useful projects you can build in a weekend.">
<meta property="og:url" content="https://byosdesign.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
html, body { background:#f4f2ed; margin:0; }

.byos, .byos * { box-sizing:border-box; }
.byos {
  --ink:#1a1917; --paper:#f4f2ed; --muted:#84817a; --rule:rgba(26,25,23,.16); --ochre:#d4a12a; /* ochre = fills, lines, stars only; never text on light */
  font-family:'JetBrains Mono', ui-monospace, monospace;
  color:var(--ink);
  max-width:460px; margin:0 auto; padding:44px 22px 30px;
  text-align:left; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.byos p { margin:0; }

.byos .mark { font-family:'Permanent Marker',cursive; font-size:clamp(38px,11vw,48px); line-height:1; letter-spacing:2px; }
.byos .mark .strike { position:relative; display:inline-block; }
.byos .mark .strike::after { content:""; position:absolute; left:-4px; right:-6px; top:52%; height:4px; background:currentColor; transform:rotate(-8deg); }

.byos h1 { font-weight:400; font-size:clamp(19px,5.4vw,22px); line-height:1.5; margin:30px 0 0; }
.byos .slot {
  font-family:'Permanent Marker',cursive; font-size:1.35em;
  display:inline-block; min-width:132px; text-align:left;
  transition:opacity .22s ease; vertical-align:baseline;
}
.byos .slot.out { opacity:0; }

.byos .lede { font-size:14px; margin-top:22px; line-height:1.7; }
.byos .sub  { font-size:13px; color:var(--muted); margin-top:10px; line-height:1.7; }

.byos figure { margin:34px 0 0; border-top:.5px solid var(--rule); border-bottom:.5px solid var(--rule); padding:20px 0 0; }
/* stacked tiles share one rule instead of doubling up */
.byos figure + figure { border-top:none; margin-top:0; }
/* Square tile image = the product's Gumroad thumbnail. multiply turns its white background into the page color. */
.byos figure img { display:block; width:100%; max-width:400px; height:auto; aspect-ratio:1/1; margin:0 auto; object-fit:contain; mix-blend-mode:multiply; }
.byos figcaption { padding:10px 0 16px; }
.byos .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.byos .name { font-size:11.5px; color:var(--muted); letter-spacing:.4px; }
.byos .status { font-family:'Permanent Marker',cursive; font-size:15px; color:var(--ink); white-space:nowrap; }
.byos .status .arr { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; margin-left:4px; }
.byos .desc { font-size:13px; line-height:1.55; margin-top:6px; }
.byos .proof { font-size:11.5px; color:var(--muted); letter-spacing:.2px; margin-top:4px; }
.byos .stars { color:var(--ochre); letter-spacing:1px; margin-right:6px; }
.byos .stars .off { color:var(--rule); }
/* purchasable tile: the whole figure is the link, opens Gumroad in a new tab */
.byos a.buy { display:block; color:inherit; text-decoration:none; }
.byos a.buy .status .lbl { border-bottom:3px solid var(--ochre); }
.byos a.buy:hover .status .lbl { border-bottom-width:4.5px; }
.byos a.buy:focus-visible { outline:2px solid var(--ink); outline-offset:4px; }

.byos .ask { font-size:14px; margin-top:32px; line-height:1.6; }
.byos form { display:flex; gap:8px; margin-top:14px; }
.byos input[type=email] {
  flex:1; min-width:0; font-family:inherit; font-size:15px; color:var(--ink);
  background:transparent; border:none; border-bottom:1.5px solid var(--ink);
  padding:8px 2px; border-radius:0; -webkit-appearance:none;
}
.byos input[type=email]:focus { outline:none; border-bottom-width:2.5px; }
.byos input::placeholder { color:var(--muted); }
.byos button {
  font-family:'Permanent Marker',cursive; font-size:16px; letter-spacing:.5px;
  color:var(--ink); background:var(--ochre); border:none; border-radius:2px;
  padding:9px 17px; cursor:pointer; white-space:nowrap;
}
.byos button:active { transform:translateY(1px); }
.byos button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

.byos footer { display:flex; justify-content:flex-end; font-size:11.5px; color:var(--muted); border-top:.5px solid var(--rule); margin-top:42px; padding-top:12px; }
.byos footer a { color:var(--muted); text-decoration:none; border-bottom:.5px solid var(--rule); }
.byos footer a:hover { color:var(--ink); }
/* figure already closes with a rule — don't stack a second one right under it */
.byos figure + footer { border-top:none; margin-top:20px; }
</style>
</head>
<body>

<div class="byos" id="byos">

  <div class="mark">BYO<span class="strike">S</span></div>

  <h1>build your own <span class="slot" id="byos-slot">storage</span></h1>

  <p class="lede">Useful projects you can build in a weekend.</p>

  <!-- Plan tiles. Parts tagged data-gumroad (image, proof line) refresh daily from Gumroad via scripts/sync_gumroad.py.
       Hand-written: link, name, description, alt text. Add a plan by copying a tile and changing the slug. -->
  <figure>
    <a class="buy" href="/go/tote-rack" target="_blank" rel="noopener" aria-label="Get the tote rack plans on Gumroad (opens in a new tab)">
      <img src="/images/thetoterack-thumb.png?v=68cf0f84" data-gumroad-thumb="thetoterack" width="600" height="600" alt="Line drawing of the tote rack, 130½ inches wide, 89 inches tall, 30 inches deep.">
      <figcaption>
        <div class="row"><span class="name">the tote rack</span><span class="status"><span class="lbl">get the plans</span><span class="arr">&#8599;</span></span></div>
        <p class="desc">Holds 22 totes, four shelves and a bench.</p>
        <p class="proof" data-gumroad="thetoterack"><span class="stars" aria-label="Rated 5.0 out of 5">&#9733;&#9733;&#9733;&#9733;&#9733;</span>2 reviews &middot; 79 sold on Gumroad</p>
      </figcaption>
    </a>
  </figure>

  <figure>
    <img src="/images/hut-thumb.webp" width="1200" height="1200" loading="lazy" alt="Line drawing of the hut: a timber-framed cabin with a single-slope roof on exposed rafters.">
    <figcaption>
      <div class="row"><span class="name">the hut</span><span class="status">plans coming</span></div>
      <p class="desc">A sleeping hut, one step up from a tent.</p>
    </figcaption>
  </figure>

  <p class="ask">Something&rsquo;s always on the workbench. Drop your email and I&rsquo;ll send the next plans when they&rsquo;re ready.</p>

  <form action="https://app.kit.com/forms/9882113/subscriptions" method="post">
    <input type="email" name="email_address" placeholder="you@somewhere.com" autocomplete="email" autocapitalize="off" spellcheck="false" inputmode="email" required>
    <button type="submit">Sign up</button>
  </form>

  <footer>
    <a href="https://www.instagram.com/kit_christopher/" target="_blank" rel="noopener">@kit_christopher</a>
  </footer>

</div>

<script>
(function(){

  /* Rotating headline words.
     hold = milliseconds this word stays on screen before it fades out.
     Set any word's hold independently. Omit hold to use DEFAULT_HOLD. */
  var DEFAULT_HOLD = 1900;
  var FADE = 240;          // must stay >= the .slot opacity transition (.22s)

  /* NOTE: the first word here must match the hardcoded text inside
     #byos-slot in the HTML above — that's what renders before the
     first tick, and what reduced-motion visitors see permanently. */
  var words = [
    { text: "storage" },
    { text: "shed"    },
    { text: "sauna"   },
    { text: "S***", hold: 950 }   // quick flash before the loop restarts
  ];

  var el = document.getElementById("byos-slot");
  if (!el) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var i = 0;

  function cycle(){
    var hold = words[i].hold || DEFAULT_HOLD;
    setTimeout(function(){
      el.classList.add("out");
      setTimeout(function(){
        i = (i + 1) % words.length;
        el.textContent = words[i].text;
        el.classList.remove("out");
        cycle();
      }, FADE);
    }, hold);
  }

  cycle();
})();
</script>

</body>
</html>
